<script>
  // Theme Switcher Logic
  const themeToggleBtn = document.getElementById('theme-toggle');
  const savedTheme = localStorage.getItem('theme');

  if (savedTheme === 'dark') {
    document.body.classList.add('dark-mode');
    themeToggleBtn.textContent = '☀️ Light Mode';
  }

  themeToggleBtn.addEventListener('click', () => {
    document.body.classList.toggle('dark-mode');
    const isDark = document.body.classList.contains('dark-mode');
    themeToggleBtn.textContent = isDark ? '☀️ Light Mode' : '🌙 Dark Mode';
    localStorage.setItem('theme', isDark ? 'dark' : 'light');
  });

  // PDF.js Setup
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  let pdfDoc = null,
      pageNum = 1,
      pageIsRendering = false,
      pageNumIsPending = null;

  const canvas = document.getElementById('pdf-render'),
        ctx = canvas.getContext('2d'),
        pageInput = document.getElementById('page-input'),
        loadingOverlay = document.getElementById('pdf-loading'),
        sidebarSource = document.getElementById('sidebar-source'),
        sourceContent = document.getElementById('source-link-content');

  const urlParams = new URLSearchParams(window.location.search);
  const selectedId = urlParams.get('id');

  fetch('textbooks.xml')
    .then(response => response.text())
    .then(str => new window.DOMParser().parseFromString(str, "text/xml"))
    .then(data => {
      const book = data.querySelector(`textbook[id="${selectedId}"]`);
      if (!book) return;

      document.getElementById('book-title').textContent = book.querySelector('title').textContent;
      const pdfPath = book.querySelector('pdfUrl').textContent;
      
      // Set source link ONCE on initial load so it never flickers on page turns
      const activeSourceUrl = book.getAttribute('sourceUrl');
      if (activeSourceUrl) {
        sourceContent.innerHTML = `<a href="${activeSourceUrl}" target="_blank" rel="noopener noreferrer">${activeSourceUrl}</a>`;
        sidebarSource.style.display = 'block';
      }

      // Build quick jump bookmarks
      const bookmarkContainer = document.getElementById('bookmark-buttons');
      const bookmarks = book.querySelectorAll('bookmark');
      bookmarks.forEach(bm => {
        const page = parseInt(bm.getAttribute('page'));
        const label = bm.textContent;
        const btn = document.createElement('button');
        btn.textContent = `${label} (p. ${page})`;
        btn.onclick = () => goToPage(page);
        bookmarkContainer.appendChild(btn);
      });

      pdfjsLib.getDocument(pdfPath).promise.then(pdfDoc_ => {
        pdfDoc = pdfDoc_;
        document.getElementById('page-count').textContent = pdfDoc.numPages;
        pageInput.max = pdfDoc.numPages;
        renderPage(pageNum);
      });
    });

  function renderPage(num) {
    pageIsRendering = true;
    loadingOverlay.style.display = 'flex';

    pdfDoc.getPage(num).then(page => {
      const outputScale = window.devicePixelRatio || 1;
      const baseScale = 1.5; 
      const viewport = page.getViewport({ scale: baseScale });

      canvas.width = Math.floor(viewport.width * outputScale);
      canvas.height = Math.floor(viewport.height * outputScale);

      canvas.style.width = Math.floor(viewport.width) + "px";
      canvas.style.height = Math.floor(viewport.height) + "px";

      const transform = outputScale !== 1 
        ? [outputScale, 0, 0, outputScale, 0, 0] 
        : null;

      const renderCtx = { 
        canvasContext: ctx, 
        viewport: viewport,
        transform: transform
      };

      page.render(renderCtx).promise.then(() => {
        pageIsRendering = false;
        loadingOverlay.style.display = 'none';

        if (pageNumIsPending !== null) {
          renderPage(pageNumIsPending);
          pageNumIsPending = null;
        }
      });

      pageInput.value = num;
    });
  }

  function queueRenderPage(num) {
    if (pageIsRendering) {
      pageNumIsPending = num;
    } else {
      renderPage(num);
    }
  }

  function goToPage(num) {
    if (num < 1 || num > pdfDoc.numPages) return;
    pageNum = num;
    queueRenderPage(pageNum);
  }

  document.getElementById('prev-page').addEventListener('click', () => {
    if (pageNum <= 1) return;
    pageNum--;
    queueRenderPage(pageNum);
  });

  document.getElementById('next-page').addEventListener('click', () => {
    if (pageNum >= pdfDoc.numPages) return;
    pageNum++;
    queueRenderPage(pageNum);
  });

  pageInput.addEventListener('change', (e) => {
    const targetPage = parseInt(e.target.value);
    if (targetPage >= 1 && targetPage <= pdfDoc.numPages) {
      goToPage(targetPage);
    } else {
      e.target.value = pageNum;
    }
  });
</script>
