<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF Viewer - Textbook Hub</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body>
  <header>
    <h1 id="book-title">Loading...</h1>
    <a href="index.html" class="nav-link">← Back to Home</a>
  </header>

  <div class="viewer-layout">
    <!-- Sidebar Navigation & Attribution -->
    <aside class="sidebar">
      <h3>Quick Jump</h3>
      <div id="bookmark-buttons" class="button-group"></div>

      <div id="sidebar-source" class="sidebar-source-box" style="display: none;">
        <h4>Source Material</h4>
        <div id="source-link-content"></div>
      </div>
    </aside>

    <main class="pdf-container">
      <div class="controls">
        <button id="prev-page" class="btn-nav">← Prev</button>
        <span>
          Page <input type="number" id="page-input" value="1" min="1"> / <span id="page-count">-</span>
        </span>
        <button id="next-page" class="btn-nav">Next →</button>
      </div>
      
      <div class="canvas-wrapper">
        <!-- Loading Overlay -->
        <div id="pdf-loading" class="pdf-loading-overlay">
          <div class="spinner"></div>
          <p>Loading PDF, please wait...</p>
        </div>

        <canvas id="pdf-render"></canvas>
      </div>
    </main>
  </div>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    let pdfDoc = null,
        pageNum = 1,
        pageIsRendering = false,
        pageNumIsPending = null,
        activeSourceUrl = null;

    const canvas = document.getElementById('pdf-render'),
          ctx = canvas.getContext('2d'),
          pageInput = document.getElementById('page-input'),
          loadingOverlay = document.getElementById('pdf-loading'),
          sidebarSource = document.getElementById('sidebar-source'),
          sourceContent = document.getElementById('source-link-content');

    const urlParams = new URLSearchParams(window.location.search);
    const selectedId = urlParams.get('id');

    fetch('textbooks.xml')
      .then(response => response.text())
      .then(str => new window.DOMParser().parseFromString(str, "text/xml"))
      .then(data => {
        const book = data.querySelector(`textbook[id="${selectedId}"]`);
        if (!book) return;

        document.getElementById('book-title').textContent = book.querySelector('title').textContent;
        const pdfPath = book.querySelector('pdfUrl').textContent;
        
        activeSourceUrl = book.getAttribute('sourceUrl');

        const bookmarkContainer = document.getElementById('bookmark-buttons');
        const bookmarks = book.querySelectorAll('bookmark');
        bookmarks.forEach(bm => {
          const page = parseInt(bm.getAttribute('page'));
          const label = bm.textContent;
          const btn = document.createElement('button');
          btn.textContent = `${label} (p. ${page})`;
          btn.onclick = () => goToPage(page);
          bookmarkContainer.appendChild(btn);
        });

        pdfjsLib.getDocument(pdfPath).promise.then(pdfDoc_ => {
          pdfDoc = pdfDoc_;
          document.getElementById('page-count').textContent = pdfDoc.numPages;
          pageInput.max = pdfDoc.numPages;
          renderPage(pageNum);
        });
      });

    function renderPage(num) {
      pageIsRendering = true;
      
      sidebarSource.style.display = 'none';
      loadingOverlay.style.display = 'flex';

      pdfDoc.getPage(num).then(page => {
        // High-DPI scaling for ultra-sharp text rendering
        const outputScale = window.devicePixelRatio || 1;
        const baseScale = 1.5; 
        const viewport = page.getViewport({ scale: baseScale });

        canvas.width = Math.floor(viewport.width * outputScale);
        canvas.height = Math.floor(viewport.height * outputScale);

        canvas.style.width = Math.floor(viewport.width) + "px";
        canvas.style.height = Math.floor(viewport.height) + "px";

        const transform = outputScale !== 1 
          ? [outputScale, 0, 0, outputScale, 0, 0] 
          : null;

        const renderCtx = { 
          canvasContext: ctx, 
          viewport: viewport,
          transform: transform
        };

        page.render(renderCtx).promise.then(() => {
          pageIsRendering = false;
          
          loadingOverlay.style.display = 'none';

          if (activeSourceUrl) {
            sourceContent.innerHTML = `<a href="${activeSourceUrl}" target="_blank" rel="noopener noreferrer">${activeSourceUrl}</a>`;
            sidebarSource.style.display = 'block';
          }

          if (pageNumIsPending !== null) {
            renderPage(pageNumIsPending);
            pageNumIsPending = null;
          }
        });

        pageInput.value = num;
      });
    }

    function queueRenderPage(num) {
      if (pageIsRendering) {
        pageNumIsPending = num;
      } else {
        renderPage(num);
      }
    }

    function goToPage(num) {
      if (num < 1 || num > pdfDoc.numPages) return;
      pageNum = num;
      queueRenderPage(pageNum);
    }

    document.getElementById('prev-page').addEventListener('click', () => {
      if (pageNum <= 1) return;
      pageNum--;
      queueRenderPage(pageNum);
    });

    document.getElementById('next-page').addEventListener('click', () => {
      if (pageNum >= pdfDoc.numPages) return;
      pageNum++;
      queueRenderPage(pageNum);
    });

    pageInput.addEventListener('change', (e) => {
      const targetPage = parseInt(e.target.value);
      if (targetPage >= 1 && targetPage <= pdfDoc.numPages) {
        goToPage(targetPage);
      } else {
        e.target.value = pageNum;
      }
    });
  </script>
</body>
</html>
