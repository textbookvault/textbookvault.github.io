<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF Viewer - Textbook Vault</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body>
  <header>
    <h1 id="book-title">Loading...</h1>
    <div class="header-actions">
      <button id="theme-toggle" class="btn-theme">🌙 Dark Mode</button>
      <a href="index.html" class="nav-link">← Back to Home</a>
    </div>
  </header>

  <div id="not-found-container" class="not-found-card" style="display: none;">
    <h2>404 - Textbook Not Found</h2>
    <p>The textbook you are looking for does not exist or may have been moved.</p>
    <a href="index.html" class="btn-primary">Return to Vault</a>
  </div>

  <div id="viewer-layout" class="viewer-layout">
    <aside class="sidebar-container">
      <div id="sidebar-notes" class="sidebar-card" style="display: none;">
        <h3>Notes</h3>
        <ul id="notes-list" class="notes-list"></ul>
      </div>

      <div class="sidebar-card">
        <h3>Quick Jump</h3>
        <div id="bookmark-buttons" class="button-group"></div>
      </div>

      <div id="sidebar-source" class="sidebar-card" style="display: none;">
        <h3>Source Material</h3>
        <div id="source-link-content"></div>
      </div>
    </aside>

    <main class="pdf-container">
      <div class="controls">
        <button id="prev-page" class="btn-nav">← Prev</button>
        <span>
          Page <input type="number" id="page-input" value="1" min="1"> / <span id="page-count">-</span>
        </span>
        <button id="next-page" class="btn-nav">Next →</button>
      </div>
      
      <div id="canvas-wrapper" class="canvas-wrapper">
        <div id="pdf-loading" class="pdf-loading-overlay">
          <div class="spinner"></div>
          <p id="loading-text">Loading PDF, please wait...</p>
        </div>

        <canvas id="pdf-render"></canvas>
        <div id="text-layer" class="textLayer"></div>
      </div>
    </main>
  </div>

  <script>
    const themeToggleBtn = document.getElementById('theme-toggle');
    const savedTheme = localStorage.getItem('theme');

    if (savedTheme === 'dark') {
      document.body.classList.add('dark-mode');
      themeToggleBtn.textContent = '☀️ Light Mode';
    }

    themeToggleBtn.addEventListener('click', () => {
      document.body.classList.toggle('dark-mode');
      const isDark = document.body.classList.contains('dark-mode');
      themeToggleBtn.textContent = isDark ? '☀️ Light Mode' : '🌙 Dark Mode';
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
    });

    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    let pdfDoc = null,
        pageNum = 1,
        pageIsRendering = false,
        pageNumIsPending = null,
        pageCache = {};

    const canvas = document.getElementById('pdf-render'),
          ctx = canvas.getContext('2d'),
          textLayer = document.getElementById('text-layer'),
          pageInput = document.getElementById('page-input'),
          loadingOverlay = document.getElementById('pdf-loading'),
          sidebarSource = document.getElementById('sidebar-source'),
          sourceContent = document.getElementById('source-link-content'),
          sidebarNotes = document.getElementById('sidebar-notes'),
          notesList = document.getElementById('notes-list'),
          viewerLayout = document.getElementById('viewer-layout'),
          notFoundContainer = document.getElementById('not-found-container'),
          pdfContainer = document.querySelector('.pdf-container');

    const urlParams = new URLSearchParams(window.location.search);
    const selectedId = urlParams.get('id');

    function showNotFound() {
      document.getElementById('book-title').textContent = 'Textbook Not Found';
      viewerLayout.style.display = 'none';
      notFoundContainer.style.display = 'block';
    }

    async function getPageFromCache(num) {
      if (pageCache[num]) return pageCache[num];
      const page = await pdfDoc.getPage(num);
      pageCache[num] = page;
      return page;
    }

    async function preloadPages() {
      const initialBatch = Math.min(10, pdfDoc.numPages);
      
      // Load initial batch of 10 pages into memory
      for (let i = 1; i <= initialBatch; i++) {
        if (!pageCache[i]) {
          pageCache[i] = await pdfDoc.getPage(i);
        }
      }

      // Preload remaining pages sequentially in background
      (async () => {
        for (let i = initialBatch + 1; i <= pdfDoc.numPages; i++) {
          if (!pageCache[i]) {
            pageCache[i] = await pdfDoc.getPage(i);
          }
        }
      })();
    }

    if (!selectedId) {
      showNotFound();
    } else {
      fetch('textbooks.xml')
        .then(response => response.text())
        .then(str => new window.DOMParser().parseFromString(str, "text/xml"))
        .then(data => {
          const book = data.querySelector(`textbook[id="${selectedId}"]`);
          if (!book) {
            showNotFound();
            return;
          }

          document.getElementById('book-title').textContent = book.querySelector('title').textContent;
          const pdfPath = book.querySelector('pdfUrl').textContent;
          
          // Render Notes instantly from XML
          const notes = book.querySelectorAll('notes > note');
          if (notes.length > 0) {
            notesList.innerHTML = '';
            notes.forEach(note => {
              const li = document.createElement('li');
              li.textContent = note.textContent;
              notesList.appendChild(li);
            });
            sidebarNotes.style.display = 'block';
          }

          // Render Source Material instantly from XML
          const activeSourceUrl = book.getAttribute('sourceUrl');
          if (activeSourceUrl) {
            sourceContent.innerHTML = `<a href="${activeSourceUrl}" target="_blank" rel="noopener noreferrer">${activeSourceUrl}</a>`;
            sidebarSource.style.display = 'block';
          }

          // Render Quick Jump bookmarks instantly from XML
          const bookmarkContainer = document.getElementById('bookmark-buttons');
          const bookmarks = book.querySelectorAll('bookmark');
          bookmarks.forEach(bm => {
            const page = parseInt(bm.getAttribute('page'));
            const label = bm.textContent;
            const btn = document.createElement('button');
            btn.textContent = `${label} (p. ${page})`;
            btn.onclick = () => goToPage(page);
            bookmarkContainer.appendChild(btn);
          });

          // Fetch PDF Document metadata
          pdfjsLib.getDocument({ url: pdfPath, nativeImageDecoderSupport: 'none' }).promise.then(pdfDoc_ => {
            pdfDoc = pdfDoc_;
            document.getElementById('page-count').textContent = pdfDoc.numPages;
            pageInput.max = pdfDoc.numPages;

            // Render first page immediately & trigger background loading
            renderPage(pageNum);
            preloadPages();
          }).catch(err => {
            console.error("PDF Load Error:", err);
            showNotFound();
          });
        })
        .catch(err => {
          console.error("XML Load Error:", err);
          showNotFound();
        });
    }

    async function renderPage(num) {
      pageIsRendering = true;
      loadingOverlay.style.display = 'flex';
      textLayer.innerHTML = '';

      try {
        const page = await getPageFromCache(num);
        const outputScale = window.devicePixelRatio || 1;
        
        const containerWidth = pdfContainer.clientWidth - 40; 
        const unscaledViewport = page.getViewport({ scale: 1 });
        const dynamicScale = containerWidth / unscaledViewport.width;
        
        const viewport = page.getViewport({ scale: dynamicScale });

        canvas.width = Math.floor(viewport.width * outputScale);
        canvas.height = Math.floor(viewport.height * outputScale);

        canvas.style.width = Math.floor(viewport.width) + "px";
        canvas.style.height = Math.floor(viewport.height) + "px";

        textLayer.style.width = Math.floor(viewport.width) + "px";
        textLayer.style.height = Math.floor(viewport.height) + "px";

        const transform = outputScale !== 1 ? [outputScale, 0, 0, outputScale, 0, 0] : null;

        const renderCtx = { 
          canvasContext: ctx, 
          viewport: viewport,
          transform: transform
        };

        await page.render(renderCtx).promise;

        pageIsRendering = false;
        loadingOverlay.style.display = 'none';

        const textContent = await page.getTextContent();
        pdfjsLib.renderTextLayer({
          textContentSource: textContent,
          container: textLayer,
          viewport: viewport,
          textDivs: []
        });

        if (pageNumIsPending !== null) {
          const nextNum = pageNumIsPending;
          pageNumIsPending = null;
          renderPage(nextNum);
        }

        pageInput.value = num;
      } catch (err) {
        console.error("Page Render Error:", err);
        pageIsRendering = false;
        loadingOverlay.style.display = 'none';
      }
    }

    function queueRenderPage(num) {
      if (pageIsRendering) {
        pageNumIsPending = num;
      } else {
        renderPage(num);
      }
    }

    function goToPage(num) {
      if (!pdfDoc || num < 1 || num > pdfDoc.numPages) return;
      pageNum = num;
      queueRenderPage(pageNum);
    }

    document.getElementById('prev-page').addEventListener('click', () => {
      if (pageNum <= 1) return;
      pageNum--;
      queueRenderPage(pageNum);
    });

    document.getElementById('next-page').addEventListener('click', () => {
      if (pageNum >= pdfDoc.numPages) return;
      pageNum++;
      queueRenderPage(pageNum);
    });

    pageInput.addEventListener('change', (e) => {
      const targetPage = parseInt(e.target.value);
      if (pdfDoc && targetPage >= 1 && targetPage <= pdfDoc.numPages) {
        goToPage(targetPage);
      } else {
        e.target.value = pageNum;
      }
    });

    window.addEventListener('resize', () => {
      if (pdfDoc) queueRenderPage(pageNum);
    });
  </script>
</body>
</html>
